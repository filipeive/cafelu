# ==============================================================================
# Configuração Nginx para RestPOS (Produção)
# Caminho: /etc/nginx/sites-available/restpos (ou incluir no default)
# ==============================================================================

server {
    listen 80;
    server_name restpos.co.mz 146.235.224.99;
    root /var/www/html/RestPOS/public;

    index index.php index.html;
    charset utf-8;

    # Otimizações de desempenho e segurança
    client_max_body_size 64M;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Roteamento principal do Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache estático otimizado para PWA, CSS, JS e Imagens
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Manifesto PWA e Service Worker sem cache rígido para atualizações instantâneas
    location ~* (manifest\.json|sw\.js)$ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Processamento PHP FastCGI (PHP 8.3 / 8.2)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Bloqueio de arquivos ocultos e sensíveis (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
